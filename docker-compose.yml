services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: seatdb
      POSTGRES_USER: seat
      POSTGRES_PASSWORD: seat
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seat -d seatdb"]
      interval: 2s
      timeout: 5s
      retries: 15

  app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/seatdb
      SPRING_DATASOURCE_USERNAME: seat
      SPRING_DATASOURCE_PASSWORD: seat
      ADMIN_KEY: ${ADMIN_KEY:-local-admin-key}
      JWT_SECRET: local-dev-secret-at-least-32-bytes-long-ok
    ports:
      - "8080:8080"
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
