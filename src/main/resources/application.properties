spring.application.name=seat-reservation

spring.datasource.url=jdbc:postgresql://localhost:5432/seatdb
spring.datasource.username=seat
spring.datasource.password=seat

# Actuator: expose health and prometheus on the main port.
management.endpoints.web.exposure.include=health,prometheus

# All JSON responses use snake_case automatically (price_paise, per_user_limit, etc.)
spring.jackson.property-naming-strategy=SNAKE_CASE

# HS256 signing secret — must be at least 32 bytes. Override via JWT_SECRET env var in prod.
jwt.secret=${JWT_SECRET:change-me-in-production-this-is-at-least-32-bytes-long!!}

# Return 404 JSON for unknown paths instead of Spring's default HTML error page.
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Virtual threads: eliminates thread pool exhaustion as a failure mode under high concurrency.
spring.threads.virtual.enabled=true

# Hikari: pool size and timeouts are env-driven so they can be tuned without a rebuild.
# connection-init-sql sets the Postgres session lock_timeout on every new connection.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:40}
spring.datasource.hikari.minimum-idle=${DB_POOL_SIZE:40}
spring.datasource.hikari.connection-timeout=${DB_CONN_TIMEOUT_MS:30000}
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '${DB_LOCK_TIMEOUT:10s}'

# Tomcat: env-driven so the ALB backlog can be tuned without a rebuild.
server.tomcat.max-connections=${TOMCAT_MAX_CONN:30000}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:4096}

# Structured JSON logs in ECS format — request_id from MDC appears automatically.
logging.structured.format.console=ecs

# Seat availability gauge refresh interval (fixedDelay — runs never overlap).
metrics.seat-gauge.interval-ms=5000
server.tomcat.mbeanregistry.enabled=true

admin.key=${ADMIN_KEY:}